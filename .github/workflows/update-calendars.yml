name: Generate Hockey Calendars

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests
          pip install aiohttp
          pip install pycryptodome
          pip install icalendar
          pip install python-dateutil

      - name: Download HockeyWeerelt
        run: |
          curl -L \
            -o hockeyweerelt.py \
            https://raw.githubusercontent.com/joosthoi1/HockeyWeerelt/main/hockeyweerelt.py

      - name: Generate calendars
        run: |
          python generate_calendars.py

      - name: Show generated files
        run: |
          ls -la
          echo ""
          ls -la public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
