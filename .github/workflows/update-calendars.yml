name: Test HockeyWeerelt

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect HockeyWeerelt module
        run: |
          python - <<'PY'
          import hockeyweerelt
          print("Module gevonden:")
          print(hockeyweerelt)
          print("Beschikbare onderdelen:")
          print(dir(hockeyweerelt))
          PY
