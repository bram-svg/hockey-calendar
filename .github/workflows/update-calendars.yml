name: Inspect HockeyWeerelt

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests
          pip install aiohttp
          pip install icalendar
          pip install python-dateutil
          pip install pycryptodome

      - name: Download HockeyWeerelt wrapper
        run: |
          curl -L \
            -o hockeyweerelt.py \
            https://raw.githubusercontent.com/joosthoi1/HockeyWeerelt/main/hockeyweerelt.py

      - name: Verify wrapper
        run: |
          ls -la hockeyweerelt.py

      - name: Inspect Api class
        run: |
          python <<'PY'
          import hockeyweerelt

          print("MODULE GELADEN")
          print()

          print("API CLASS")
          print(hockeyweerelt.Api)
          print()

          print("API ATTRIBUTEN")
          print(dir(hockeyweerelt.Api))
          PY

      - name: Show Api source
        run: |
          grep -A 200 "class Api" hockeyweerelt.py
