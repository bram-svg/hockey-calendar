name: Generate Hockey Calendars

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests
          pip install aiohttp
          pip install pycryptodome
          pip install icalendar
          pip install python-dateutil

      - name: Download HockeyWeerelt wrapper
        run: |
          curl -L \
            -o hockeyweerelt.py \
            https://raw.githubusercontent.com/joosthoi1/HockeyWeerelt/main/hockeyweerelt.py

      - name: Generate calendars
        run: |
          python generate_calendars.py

      - name: Show generated files
        run: |
          echo "ROOT DIRECTORY"
          ls -la

          echo ""
          echo "PUBLIC DIRECTORY"
          ls -la public

      - name: Upload ICS files
        uses: actions/upload-artifact@v4
        with:
          name: hockey-calendars
          path: public/*.ics

      - name: Show files
        run: |
           ls -lah publi
